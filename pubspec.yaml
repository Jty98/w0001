name: w0001
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 상태관리
  flutter_riverpod: ^3.1.3
  go_router: ^14.8.1
  # 캘린더
  table_calendar: ^3.0.9
  # 로컬 데이터베이스
  sqflite: ^2.3.3
  # HTTP 클라이언트 (백엔드 API 통신용)
  dio: ^5.4.0
  # 다국어 지원
  flutter_localizations:
    sdk: flutter
  # 파일 경로 관리
  path: ^1.9.0
  # 날짜 선택
  date_picker_plus: ^3.0.2
  # 슬라이드 액션
  flutter_slidable: ^4.0.3
  # 리스트 그룹화
  grouped_list: ^5.1.2
  # 검색 가능한 드롭다운
  dropdown_search: ^5.0.6
  # 통화 입력 포맷
  currency_text_input_formatter: ^2.2.2
  # 파일 공유
  share_plus: ^12.0.1
  # 앱 디렉토리 접근
  path_provider: ^2.1.3
  # 엑셀 파일 생성
  excel: ^4.0.6
  # 파일 선택
  file_picker: ^5.2.10
  # Win32 API (excel 패키지 의존성 호환성)
  win32: ^5.15.0
  # 그래프
  fl_chart: ^1.2.0

  scrollable_calendar_package:
    path: /Users/jeongtaeyoung/JTY/flutter/my_package/scrollable_calendar_package
  alarm: ^5.2.1
  permission_handler: ^12.0.1
  screenshot: ^3.0.0
  home_widget: ^0.9.1
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_lint: ^3.1.3

dependency_overrides:
  path_provider_foundation: 2.4.1
  
flutter:
  fonts:
    - family: SCDream
      fonts:
        - asset: assets/fonts/SCDream5.otf



  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/excel_logo.png
    - assets/images/add_money.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
